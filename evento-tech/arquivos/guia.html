<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guia de HTML</title>
</head>

<body>

    <h1>Guia de HTML</h1>

    <p>
        HTML é a linguagem de marcação utilizada para
        estruturar páginas da web.
    </p>

    <h2>Principais elementos</h2>

    <ul>
        <li>h1 — título principal</li>
        <li>p — parágrafo</li>
        <li>a — link</li>
        <li>img — imagem</li>
        <li>ul — lista não ordenada</li>
        <li>ol — lista ordenada</li>
    </ul>

</body>

</html>
